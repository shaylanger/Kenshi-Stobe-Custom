[ProfessionGear]
Enabled=true
AutoClassify=true

# Overall multiplier applied to quality-tier affix probabilities.
GlobalChance=1.0

# Increased chance when an NPC's inferred primary profession matches the item.
NpcRoleMultiplier=1.35

# Increased chance for player-crafted eligible items.
PlayerCraftMultiplier=1.15

# Applied to slaves and extremely low-tier NPCs.
PoorNpcMultiplier=0.20

# High tiers may roll a second coherent profession bonus.
MaxAffixes=2
