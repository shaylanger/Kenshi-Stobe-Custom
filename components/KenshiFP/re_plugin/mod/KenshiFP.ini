; KenshiFP configuration -- optional file, hot-reloaded in-game (edits apply
; within a second, no restart needed). Delete any line to use its default.

; Frame limiter without vsync (15-1000). 0 = off.
fps_cap=0

; Feature toggles (1 = on, 0 = off)
aim_lean=1        ; character bends through the spine when looking up/down (weapon drawn)
ranged_freeaim=1  ; in ranged combat: aim pose + bolts follow the crosshair, no lock-on
wheel_speed=1     ; scrollwheel selects walk/jog/run
ko_vignette=1     ; blackout + wake-up fade while knocked unconscious

; Camera / feel tuning
fov=70            ; vertical field of view in first person (40-120)
near_clip=3.0     ; near clip plane, world units (0.5-10; lower = see closer geometry
                  ; but WORSE depth precision). Keep at 3.0: z-buffer precision scales
                  ; with this value, and below ~3 the depth test at foliage/rock burial
                  ; seams drops under the precision floor at mid/far range -- planted
                  ; foliage z-fights through the terrain and flickers every frame while
                  ; the camera turns (the same artifact vanilla shows at ground-level
                  ; zoom). 3.0 = ~30cm: closer geometry clips, which is fine in FP.
sensitivity=1.0   ; mouse look multiplier (0.05-10)
eye_forward=0.8    ; eye position forward of the head bone (-50 to 10, default 0.8 = just
                   ; in front of the head; true head attachment carries this in the head
                   ; frame). NEGATIVE
                   ; values pull the camera BEHIND the head: combine e.g.
                   ; eye_forward=-6, eye_up=1.5, eye_shift=1.5 (and hide_head=0,
                   ; hide_headgear=0) for an over-the-shoulder third-person camera.
                   ; No camera collision: walls/props can clip between you and the body.
eye_up=0           ; raise(+)/lower(-) the camera vertically (-50 to 50, world units)
eye_shift=0        ; slide the camera right(+)/left(-) of the look direction (-50 to 50)
cam_weld=1         ; 1 = camera welded to the animated head bone (true first-person feel:
                   ; step bob, spine lean, hurt sways all reach the camera). 0 = UN-weld:
                   ; the camera follows the character's position with smoothed height and
                   ; ignores the head animation entirely -- the steady tracking feel of a
                   ; third-person-shooter controller. Recommended 0 when using the
                   ; over-the-shoulder eye_forward/eye_up/eye_shift setup above.
move_forward=1.0   ; weld-lag prediction scale: 1.0 = exact one-frame lead, 0 = off (0-10)
move_speed_ref=60  ; feet units/sec (at 1x) that counts as "full run" (5-400)
aim_lean_amount=0.5 ; how far the spine bends at full look up/down (0-1.5)
exit_camera_zoom=0  ; distance the camera returns to when you LEAVE first person. 0 = auto
                    ; (use the zoom from when you entered). Set e.g. 40 to push it back; use a
                    ; NEGATIVE value (e.g. -40) to flip it to the other side. Hot-reloads.

; --- Sneak detection eye (screen-space, in first person) ---
sneak_eye=1        ; 1 = show the sneak eye at the crosshair when sneaking, 0 = hide
state_hud=1        ; 1 = combat state label under the crosshair (HOLSTERED/READY/SWINGING/BLOCKING/AIMING...), 0 = hide
stealth_arrows=0   ; 1 = show the world-space 3D detection arrows, 0 = hide them (default)
sneak_offset_x=0   ; nudge the eye left(-)/right(+) from its default spot, in pixels
sneak_offset_y=0   ; nudge the eye up(-)/down(+) from its default spot, in pixels

; --- Floating status UI (screen-space, in first person) ---
screen_status=1    ; 1 = pin your own floating statuses (lockpick % bar, "Pick failed",
                   ;     "Pick success!", "*Thunk*", ...) near the crosshair; 0 = leave
                   ;     them projecting from your character's head as in third person
status_offset_x=0  ; nudge the pinned statuses left(-)/right(+) in pixels
status_offset_y=0  ; nudge the pinned statuses up(-)/down(+) in pixels
                   ; (all three are also on the F10 settings panel)

; --- Hiding your own head in first person ---
hide_head=1        ; 1 = hide the head mesh while in first person (needs the painted
                   ; part-map textures that ship with the mod), 0 = leave it visible
head_hide_mask=0x200 ; shader hiddenMask bit used for the head (bit 9 = the teal row the
                   ; mod paints into the race part maps). Do not change unless you know why.
hide_headgear=1    ; 1 = also hide WORN head-covering gear (hat/helmet/face plate/hair/
                   ; beard) while the head is hidden. Without this they keep floating
                   ; where your head was -- you end up inside your own helmet.
headgear_slots=0x201c ; which equipment slots count as "head covering" (bit N = AttachSlot N).
                   ; 0x201c = HAIR(2)|HAT(3)|EYES(4)|BEARD(13). Other bits: WEAPON 0x1,
                   ; BACK 0x2, BODY 0x20, LEGS 0x40, SHIRT 0x100, BOOTS 0x200,
                   ; GLOVES 0x400, NECK 0x800, BACKPACK 0x1000, BELT 0x4000.
                   ; If a specific helmet still shows, check KenshiFP.log for its
                   ; "[head] gear ... slot=N" line and add 1<<N here.

; --- Interior floor look-ahead (multi-storey buildings) ---
auto_floors=1      ; 1 = in first person the building cutaway follows YOUR character's
                   ;     floor, and the floor above is pre-revealed (interior props +
                   ;     walls) so stairwells and ceilings don't slice away while you
                   ;     climb; the exterior stays hidden. 0 = vanilla cutaway.
                   ; (also on the F10 settings panel as "Auto floors")

; --- Falling (cliffs, roofs, walls, stair edges) ---
; Walking off an edge in first person, tiered by severity. SMALL drops are a
; "walk-off": the character keeps their feet and their animations, follows a real
; gravity arc, and just keeps going on landing -- no ragdoll, no get-up. DEEP
; drops (or a walk-off that stays airborne past fall_air seconds) become a full
; ragdoll dive into the engine's own physics: tumbling, vanilla fall damage,
; engine get-up, KO on hard landings. Trigger = pushing WASD into an edge ~0.2s.
falling=0          ; 1 = enable falling off edges, 0 = stall at the lip (vanilla).
                   ; OFF by default -- also on the F10 panel as "Falling"
fall_drop=3.0      ; minimum height drop (units) that counts as an edge (2-200)
fall_probe=1.3     ; edge sample distance (units). Two samples (here and +0.8
                   ; further) must BOTH show the full drop -- one alone reads
                   ; stairwell voids as edges and throws you across staircases.
                   ; The lip must be within about this distance before you go over.
fall_air=0.9       ; falls shorter than this (seconds) land ON YOUR FEET and you
                   ; keep moving; longer falls crumple into the KO ragdoll at the
                   ; impact point (fall damage + wake-up are engine-native)
fall_settle=0.8    ; seconds the body must lie still before get-up is requested
fall_timeout=8.0   ; max seconds of tumbling before get-up is forced anyway

; --- Jumping (spacebar rebind) ---
; In first person, space is REBOUND from pause to JUMP: the vanilla spacebar
; pause is reverted within the same frame (invisible), and pausing moves to
; key_pause instead -- so pause always still works: P (default) pauses/resumes
; in FP, and outside FP (or with any menu/map open) the vanilla spacebar is
; completely untouched. The jump rides the walk-off arc: WASD momentum carries,
; landings get the knee-bend absorb, and jumping off a real cliff becomes a
; real fall (fall damage / KO included).
jump=0             ; 1 = spacebar jumps in FP, 0 = vanilla spacebar (pause).
                   ; OFF by default -- also on the F10 panel as "Jump (Space)".
                   ; Independent of falling=: jumping works with falling off
                   ; (you can still jump off a ledge and take the fall), and
                   ; the spacebar-pause rebind only applies while this is on
jump_vel=45        ; takeoff vertical velocity (units/s, 10-200). Apex height =
                   ; jump_vel^2 / (2 * fall_gravity) -- 45 with gravity 150 = ~6.75
key_jump=32        ; jump key as a Windows VK code (32 = spacebar)
key_pause=80       ; FP pause/resume toggle as a VK code (80 = P). 0 disables
                   ; the mod's pause key (rebind pause in Kenshi's options then)

; --- Custom locomotion (EXPERIMENTAL) ---
; Full-body first-person locomotion: pre-retargeted clips (locomotion.kfa, baked
; offline by tools/retarget_locomotion.py) mixed at runtime into a movement-driven
; 8-way blendspace (idle/walk/jog by real speed + WASD direction) with procedural
; turn-in-place steps while standing.
locomotion=1        ; 1 = custom first-person locomotion (8-way blendspace,
                    ; turn-in-place, foot IK, aim-follow). 0 = VANILLA Kenshi
                    ; animations -- everything else in the mod keeps working.
                    ; (also on the F10 settings panel as "Custom anims")
loco_clip=-1        ; -1 = full blendspace (normal). >=0 = force ONE clip by index
                    ; (debug; see the clip list in KenshiFP.log)
loco_hips=1         ; 1 = drive the pelvis from the clips (hip sway, consistent pose);
                    ; 0 = parked at bind (debug)
loco_walk_ref=14.0  ; pure speed (units/s, game-speed divided out) of a full walk
loco_jog_ref=38.0   ; pure speed of a full jog -- gait blends walk->jog between these
; True-FP movement feel
loco_face_lock=1    ; 1 = body faces the CAMERA: WASD strafes/backpedals (true FP) and
                    ; standing turns use turn-in-place steps. 0 = vanilla orient-to-motion
loco_foot_ik=1      ; foot-to-ground IK: plants the feet on terrain, slopes and building
                    ; stairs (engine ground query) during turn-in-place, stops, and while
                    ; standing on uneven ground. 0 = off
tip_start_deg=35    ; camera deviation (degrees) that triggers a turn-in-place while idle
tip_turn_deg=180    ; how fast the body swivels during a turn-in-place (deg/s) -- raise for
                    ; snappier response, lower for more deliberate turns
head_max_deg=83     ; neck-twist cap (Destreza HeadMax): standing, the camera cannot yaw
                    ; further than this off the body -- pushing the mouse against the cap
                    ; drags the body through the turn-in-place ("turn lock"). 0 = no cap
loco_aim=1          ; aim offsets while moving: the spine follows the camera pitch (look
                    ; up/down bends the torso) and LEADS its yaw (upper body turns ahead
                    ; of the body on quick camera flicks) -- natural FP upper-body feel
loco_aim_pitch=1.2  ; pitch gain (0-4)
loco_aim_yaw=0.8    ; yaw-lead gain (0-4)
loco_aim_roll=0.5   ; roll bank: fraction of the yaw offset applied as a lateral lean,
                    ; so looking left/right tilts the torso slightly into the look (0-2)
loco_lean=0.5       ; accel-lean spring gain: the torso leans INTO starts/stops/strafes
                    ; and springs back (Destreza torso lean). 0 = off, up to 5
loco_brake=6.0           ; glide brake (1/s): extra damping on the momentum slide after
                         ; releasing the keys -- 6 roughly halves the vanilla glide in
                         ; every tier; 0 = full vanilla momentum, up to 30 = near-instant
loco_follow_rate=10.0    ; moving body-follow catch-up rate (rad/s)
loco_follow_dead_deg=0   ; moving body-follow deadzone (deg). 0 = body glued to the camera
                         ; while moving (yaw twist is an idle-only behavior); raise for a
                         ; sustained over-the-shoulder look while running (0-45)

; Key rebinds (Windows virtual-key codes, decimal or 0x hex).
; Common codes: letters = 0x41-0x5A ('A'..'Z'), Right Alt = 0xA5, Left Alt = 0xA4,
; CapsLock = 0x14, Tab = 0x09, F1-F12 = 0x70-0x7B, mouse4 = 0x05, mouse5 = 0x06.
key_toggle_fp=0xA5
key_forward=0x57  ; W
key_left=0x41     ; A
key_back=0x53     ; S
key_right=0x44    ; D
key_settings=0x79 ; F10 -- opens/closes the in-game settings panel
key_free_cursor=0xA4 ; Left Alt -- PRESS to free the mouse / press again to re-lock (move the
                     ; cursor without opening UI). Does not override Kenshi's own Left Alt. 0 = disable.
key_sprint=0xA0      ; Left Shift -- HOLD to sprint. The scrollwheel throttle covers
                     ; walk..jog only; sprint is this modifier (classic FP controls). 0 = disable.
