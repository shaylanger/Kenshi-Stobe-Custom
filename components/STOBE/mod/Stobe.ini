[Settings]
; Keep ServerHost at 127.0.0.1 for the normal local distro flow.
; Change ServerHost to another PC's LAN IP to run StobeServer on a second machine.
ServerHost=127.0.0.1
ServerPort=8083
GeneralHotkey==
ChatHotkey=/
PushToTalkHotkey=V
; NPC info panel hotkey (\ [ ] F1-F12, letter/digit, - = off)
NpcInfoHotkey=\
TalkRadius=80
ShoutRadius=200
BoredEventRange=200
TTSVolume=100
TtsEnabled=1
EnableDialogueMenuTTS=1
Speed Dialogue=0
EnableRegularDialogueCapture=0
EnableItemImageSync=0
EnableStatusHud=0
EnableNpcRename=0
BoredEventTimerHours=3
EnableMOTD=1
AnimalTalks=0
UseNearestPlayerSpeaker=1

[AutonomySafetyProbe]
; Phase 0 development harness. Keep disabled during normal play.
; When TargetSerial=0, enabling the probe latches the currently selected
; player-faction character. Increment CommandNonce after the game is running
; to execute Command once. Valid commands: OBSERVE, IDLE, TRAVEL, RESET.
Enabled=0
TargetSerial=0
TelemetryIntervalMs=2000
Command=OBSERVE
CommandNonce=0
; TRAVEL is rejected unless this is explicitly set to 1.
TravelDestinationSet=0
TravelX=0
TravelY=0
TravelZ=0

[SocialRelationships]
; Phase 1 structured shadow capture. Off until isolated game testing.
Capture=0

[DrawnWeapon]
; NPCs react to a player character holding a drawn weapon near them (first- and
; third-person) when they can see him: neutral-or-better NPCs speak one line about
; it, town guards tell him to put it away, NPCs below neutral warn first and attack
; if the weapon stays out in range for WarnSeconds or he closes in to AttackDistance.
; Holstering cancels the warning. Distances in game units (10 = ~1 m).
Enabled=1
Radius=100
WarnSeconds=4
AttackDistance=30
; No attack sooner than MinWarnSeconds after the warning; closing in counts only if he came
; CloseMargin (game units) nearer than where he stood at the warning.
MinWarnSeconds=1
CloseMargin=5
CooldownSeconds=90
; a re-draw this soon after a cancelled warning re-arms it without a new line
RewarnSeconds=20
; faction relation or Stobe relationship below this = hostile (warn, then attack)
HostileRelationBelow=0
; -1 = native sight only; else the native FOV score must also reach this
MinFovScore=-1
